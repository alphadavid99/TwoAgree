name: Deploy to Firebase Hosting

# Auto-deploys the web app to Firebase Hosting on every push to main.
#
# ONE-TIME SETUP (Dave): add a single repo secret named FIREBASE_SERVICE_ACCOUNT
# (a Firebase service-account JSON key). Step-by-step in docs/DEPLOY.md.
#
# The public Firebase web config lives in the committed .env.production, so no
# repo Variables are needed. Until the secret exists this job runs but no-ops,
# keeping main green. Cloud Functions and the database rules deploy here too, so
# a rules change (e.g. the consents node) reaches production without a manual
# step.
#
# ORDERING, and why the later steps use `!cancelled()`:
# Functions go first so that in the normal case the front-end never goes live
# pointing at a function that isn't there. But a *failed* Functions deploy used
# to skip Hosting entirely — and a Functions deploy can fail for reasons that
# have nothing to do with the app (a missing Secret Manager entry, an Eventarc
# IAM binding CI isn't allowed to grant). That turned infrastructure hiccups
# into "the site silently stayed on the previous build while the PR check sat
# green", which cost three release attempts on 26 Jul.
# So Hosting and the rules now deploy even if Functions failed. The job still
# goes RED, and the summary says plainly what shipped and what didn't. A
# front-end that genuinely needs a brand-new function ships behind a flag —
# that's the existing pattern (VITE_PATH_ENABLED), and it's the right one.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gate on the secret being present. No secret yet → skip the deploy steps
      # instead of failing, so main stays green until setup is done.
      - id: gate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_SERVICE_ACCOUNT is not set yet — skipping deploy."
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.gate.outputs.ready == 'true'
        run: npm ci

      # Observability is opt-in and supplied here rather than committed, so the
      # repo carries no vendor identifiers. Both are safe in a client bundle (a
      # Sentry DSN is public by design; the Plausible domain is just a domain) —
      # they live in repo settings only so Dave can turn them on without a code
      # change. Vite lets a process env var override .env.production, so an
      # unset one simply leaves the feature off.
      #   Secret   SENTRY_DSN         (Settings → Secrets → Actions)
      #   Variable PLAUSIBLE_DOMAIN   (Settings → Variables → Actions)
      - id: build
        if: steps.gate.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          VITE_BUILD_SHA: ${{ github.sha }}

      # Cloud Functions (generatePath, invites, GDPR, and — once enabled — the
      # reveal-ready email). First, so the happy path publishes them before the
      # front-end that calls them. See the ordering note at the top of the file
      # for why a failure here no longer stops the release.
      - name: Deploy Cloud Functions (live)
        id: functions
        if: steps.gate.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Binds the RESEND_API_KEY secret to the reveal-ready email trigger and
          # exports the trigger at all. Leave unset until BOTH the secret exists
          # and the Eventarc IAM roles have been granted by a project owner —
          # docs/DEPLOY.md has the three gcloud commands. Turning it on without
          # them fails this step (though no longer the whole release).
          NOTIFY_EMAIL_ENABLED: ${{ vars.NOTIFY_EMAIL_ENABLED }}
        run: |
          npm --prefix functions ci
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy \
            --only functions \
            --project twoagreeapp \
            --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      # `!cancelled()` rather than `success()`: the site must still ship when the
      # Functions step failed for an infrastructure reason. A failed Functions
      # deploy leaves the PREVIOUS generation of functions running, so the app
      # lands on a working backend, just not a newer one.
      - name: Deploy to Firebase Hosting (live)
        id: hosting
        # Requires the BUILD to have succeeded — `!cancelled()` alone would
        # happily publish a stale or half-written dist. It deliberately does not
        # require the Functions step.
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' && steps.build.outcome == 'success' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: twoagreeapp
          channelId: live

      # Deploy the Realtime Database security rules from database.rules.json.
      # The Hosting action above never touches rules, so without this the
      # committed rules (e.g. the consents/{uid} node onboarding writes to)
      # never reach production and those writes get PERMISSION_DENIED.
      # These are SECURITY rules — the last thing that should be held hostage by
      # an unrelated Functions failure, hence `!cancelled()` here too.
      - name: Deploy Realtime Database rules (live)
        id: rules
        # database.rules.json is a committed file — this needs neither the build
        # nor the functions, only credentials.
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy \
            --only database \
            --project twoagreeapp \
            --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      # Say what actually shipped. A red job with no explanation is how "the
      # deploy failed" gets misread as "nothing went out" — or worse, how a
      # green-looking PR check gets misread as "it's live".
      - name: Report what shipped
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' }}
        env:
          FUNCTIONS: ${{ steps.functions.outcome }}
          HOSTING: ${{ steps.hosting.outcome }}
          RULES: ${{ steps.rules.outcome }}
        run: |
          mark() {
            case "$1" in
              success) echo "✅ shipped" ;;
              skipped) echo "⏭️ skipped" ;;
              *)       echo "❌ failed" ;;
            esac
          }
          {
            echo "### Deploy result"
            echo ""
            echo "| Target | Result |"
            echo "| --- | --- |"
            echo "| Cloud Functions | $(mark "$FUNCTIONS") |"
            echo "| Hosting (the site) | $(mark "$HOSTING") |"
            echo "| Database rules | $(mark "$RULES") |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HOSTING" != "success" ]; then
            echo "::error title=The site did NOT update::Hosting did not ship, so twoagree.app is still on the previous build."
          elif [ "$FUNCTIONS" != "success" ]; then
            echo "::error title=Site shipped, Cloud Functions did not::twoagree.app IS updated and running against the PREVIOUS generation of functions. Common causes: a Secret Manager entry that does not exist, or Eventarc IAM roles CI cannot grant — see docs/DEPLOY.md."
          fi
