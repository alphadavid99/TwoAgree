asons they might find it hard.`,type:`open`,depth:4,note:`Tests self-honesty; the 'hard' three matter most.`},{id:`SELF-006`,q:`How much do you need to feel in control?`,type:`scale`,depth:4,note:`Surfaces control and flexibility.`,guessable:!0,lo:`Easygoing, happy to go with the flow`,hi:`I need to be in control`},{id:`SELF-007`,q:`What are your biggest fears in life right now?`,type:`open`,depth:4,note:`Surfaces fears beyond the relationship itself.`},{id:`SELF-012`,q:`How easily do you forgive?`,type:`scale`,depth:4,ref:`Colossians 3:13`,note:`Surfaces whether grudges linger or release.`,guessable:!0,core:!0,lo:`I hold on a long time`,hi:`I forgive quickly`}]},"us-compatibility":{name:`Us`,color:`#9C4A6E`,icon:`heart`,hook:{id:`US-024`,q:`How much are you counting on me changing after we marry?`},questions:[{id:`US-008`,q:`What about me makes you proud?`,type:`open`,depth:1,note:`An affirming prompt that builds each other up.`},{id:`US-010`,q:`Whose marriage do you admire, and what do they do that you'd want for us?`,type:`open`,depth:1,note:`Surfaces role models for a healthy marriage.`},{id:`US-014`,q:`Where did most of what you believe about marriage come from?`,type:`mc`,depth:1,note:`Surfaces the source of marriage assumptions.`,guessable:!0,core:!0,opts:[`My parents`,`Friends`,`Church`,`Books or media`,`Mostly figuring it out`]},{id:`US-034`,q:`Should this season be more about having fun or seriously evaluating our future?`,type:`scale`,depth:1,note:`Surfaces approach to dating; catches the over-spiritualizing-it trap.`,guessable:!0,lo:`Mostly enjoy it`,hi:`Seriously evaluate it`},{id:`US-050`,q:`How much of your enjoyment of something comes from having someone to share it with?`,type:`scale`,depth:1,note:`Enjoyment amplification, distinct from FUN-006 (how free time gets allocated) and SELF-013 (solitude to recharge). This is whether company is what makes it good.`,guessable:!0,lo:`I enjoy things just as much alone`,hi:`Everything's better shared`},{id:`US-001`,q:`What does being 'compatible' actually mean to you?`,type:`open`,depth:2,note:`Surfaces each person's working definition of fit.`},{id:`US-003`,q:`Name three ways we're alike and three ways we're different - which differences do you actually treasure?`,type:`open`,depth:2,note:`Surfaces how differences are held.`},{id:`US-005`,q:`Forget 'perfect' - paint me your picture of a realistic, great marriage.`,type:`open`,depth:2,note:`Surfaces marriage expectations grounded in reality.`},{id:`US-006`,q:`Rank what makes a marriage last, most important first.`,type:`rank`,depth:2,note:`Surfaces priorities; compare the two rankings.`,core:!0,opts:[`Communication`,`Commitment`,`Shared faith`,`Trust`,`Friendship`,`Intimacy`,`Shared goals`]},{id:`US-009`,q:`How would you keep romance alive over the long haul?`,type:`open`,depth:2,note:`Surfaces intentionality about romance.`},{id:`US-013`,q:`How open are you to premarital counseling now, and marriage counseling later if we needed it?`,type:`mc`,depth:2,note:`Surfaces openness to outside help.`,guessable:!0,opts:[`Definitely`,`If we needed it`,`I'd be hesitant`,`Not sure`]},{id:`US-017`,q:`What do you picture for the future of us?`,type:`open`,depth:2,note:`Surfaces shared vision and direction.`},{id:`US-027`,q:`Rank the markers of readiness for marriage, most important first.`,type:`rank`,depth:2,ref:`Luke 14:28`,note:`Turns 'what markers of maturity matter' into a compare-your-lists ranking.`,opts:[`Spiritual maturity`,`Emotional health`,`Financial stability`,`Conflict-resolution skills`,`Living independently`,`Career direction`]},{id:`US-029`,q:`How do you feel about the pace our relationship is moving?`,type:`scale`,depth:2,ref:`Ecclesiastes 3:1`,note:`Surfaces a pace mismatch directly; gap between answers is the signal.`,guessable:!0,lo:`Too slow for me`,hi:`Too fast for me  (3 = just right)`},{id:`US-030`,q:`How important is it to you that I get along with your closest friends?`,type:`scale`,depth:2,note:`A practical compatibility check the friendship section raises.`,guessable:!0,lo:`Not important`,hi:`Essential`},{id:`US-031`,q:`Once you knew it was right, how soon would you want to get married?`,type:`mc`,depth:2,note:`Engagement-to-marriage timeline, distinct from readiness markers (US-027).`,guessable:!0,opts:[`Within a year`,`One to two years`,`Two years or more`,`No rush at all`]},{id:`US-033`,q:`What's your goal for this season of dating?`,type:`mc`,depth:2,note:`Surfaces dating intent/seriousness — the 'are we on the same page' question.`,guessable:!0,opts:[`Heading toward marriage`,`Seeing if we're compatible`,`Enjoying it for now`,`Not sure yet`]},{id:`US-035`,q:`How important is it that your spouse is also your best friend?`,type:`scale`,depth:2,ref:`Song of Solomon 5:16`,note:`The friendship-vs-romance value behind 'enjoy time together in non-romantic settings'.`,guessable:!0,core:!0,lo:`Romance matters more to me`,hi:`Best friends first`},{id:`US-039`,q:`As a couple, how involved in community do you want to be?`,type:`scale`,depth:2,note:`Couple-level community orientation, distinct from individual social rhythm (HEALTH-002).`,guessable:!0,lo:`Mostly just us`,hi:`Deeply involved in community`},{id:`US-048`,q:`How clear are you on what you're looking for in a spouse?`,type:`scale`,depth:2,note:`Confidence rather than content. DEAL-002 asks what the must-haves are; this asks whether the person actually knows.`,guessable:!0,lo:`Still working it out`,hi:`I know exactly`},{id:`US-002`,q:`What tells you that what we have is really love and not just strong feelings?`,type:`open`,depth:3,note:`Surfaces how each distinguishes love from infatuation.`},{id:`US-004`,q:`What would marriage give you that staying single wouldn't?`,type:`open`,depth:3,note:`Surfaces the 'why marriage' for each.`},{id:`US-015`,q:`In marriage, what would you want us to lean on each other for - and what would you keep as your own?`,type:`open`,depth:3,note:`Surfaces healthy interdependence and boundaries.`},{id:`US-016`,q:`What's something you've always wanted to ask me but never have?`,type:`open`,depth:3,note:`A trust-builder that opens hidden doors.`},{id:`US-019`,q:`Whose blessing on our relationship matters most to you?`,type:`rank`,depth:3,ref:`Proverbs 15:22`,note:`The wise-counsel flag; compare whose voices each weights heaviest.`,opts:[`Our parents`,`A pastor or mentor`,`Close friends`,`Our small group or church`]},{id:`US-020`,q:`How much should wise counsel from people we trust shape our biggest decisions?`,type:`scale`,depth:3,ref:`Proverbs 11:14`,note:`Echo-chamber vs real discernment, as a shared posture.`,guessable:!0,lo:`We decide on our own`,hi:`It shapes us heavily`},{id:`US-021`,q:`In choosing a life partner, what matters more to you?`,type:`scale`,depth:3,ref:`Amos 3:3`,note:`The 'clarity over chemistry' principle as a value both rate.`,guessable:!0,core:!0,lo:`Chemistry and connection`,hi:`Clarity and shared direction`},{id:`US-022`,q:`How much should a couple agree on the big things before marrying, rather than working it out later?`,type:`scale`,depth:3,note:`Surfaces how much pre-marriage alignment each thinks is needed.`,guessable:!0,lo:`Work most of it out later`,hi:`Agree on the big things first`},{id:`US-023`,q:`How much do you believe a person's habits and character can change after marriage?`,type:`scale`,depth:3,note:`The 'fixer-upper' belief — general view, pairs with the personal one below.`,guessable:!0,core:!0,lo:`People rarely change`,hi:`People can change a lot`},{id:`US-025`,q:`Do you think marriage will improve our current problems, or mostly reveal them?`,type:`scale`,depth:3,note:`Surfaces an idealistic vs realistic view of what marriage does.`,guessable:!0,lo:`Marriage will help fix things`,hi:`Marriage mainly reveals what's already there`},{id:`US-026`,q:`When hard seasons hit, how do you expect we'll get through them?`,type:`mc`,depth:3,ref:`James 1:2-4`,note:`Surfaces the couple's expected coping mode for trials.`,guessable:!0,opts:[`Lean on God together`,`Lean mainly on each other`,`Push through practically`,`Seek outside help and counsel`]},{id:`US-032`,q:`Rank what should come first in our life together.`,type:`rank`,depth:3,ref:`Matthew 6:33`,note:`Surfaces ordering of life priorities; the 'marriage as first ministry' theme.`,core:!0,opts:[`God`,`Each other`,`Our children`,`Work and career`,`Extended family`,`Ministry and serving`]},{id:`US-036`,q:`Early in a relationship, how much do you guard your heart versus give it fully?`,type:`scale`,depth:3,ref:`Proverbs 4:23`,note:`Emotional investment pace, distinct from relationship-progression pace (US-029).`,guessable:!0,lo:`I guard it carefully`,hi:`I give my heart fully and fast`},{id:`US-037`,q:`How open are you to people close to us questioning our relationship?`,type:`scale`,depth:3,ref:`Proverbs 27:6`,note:`Openness to scrutiny of the relationship itself — the isolation red flag.`,guessable:!0,lo:`I'd rather they stayed out of it`,hi:`I welcome their honest questions`},{id:`US-038`,q:`How much should partners push each other to grow, versus accept each other as they are?`,type:`scale`,depth:3,ref:`Proverbs 27:17`,note:`The growth-pushing tension behind 'support each other's growth without pressure'; broader than the spiritual version (FAITH-008).`,guessable:!0,lo:`Accept each other as we are`,hi:`Actively push each other to grow`},{id:`US-040`,q:`How readily would you give up a hobby or commitment if it was hurting our relationship?`,type:`scale`,depth:3,ref:`Philippians 2:4`,note:`Willingness to sacrifice outside commitments, distinct from ranking priorities (US-032).`,guessable:!0,lo:`I'd be reluctant`,hi:`Readily`},{id:`US-043`,q:`How much room does your life have right now for this to grow?`,type:`scale`,depth:3,note:`Present-tense capacity. US-033 asks intent; nothing in the bank asks whether the person actually has the bandwidth to act on it.`,guessable:!0,lo:`I'm stretched thin`,hi:`Plenty of room`},{id:`US-047`,q:`How long does it take to really know someone?`,type:`mc`,depth:3,note:`The epistemics of knowing a person, distinct from relationship pace (US-029) and emotional pace (US-036). Two people who differ here will disagree about engagement timing without knowing why.`,guessable:!0,opts:[`A few months`,`About a year`,`Two years or more`,`You never fully do`]},{id:`US-007`,q:`How confident are you that we'd go the distance?`,type:`scale`,depth:4,note:`Surfaces commitment and realism about lasting.`,guessable:!0,lo:`Some real doubts`,hi:`Completely confident`},{id:`US-012`,q:`What life experiences would you hope your future spouse had had - and which would you hope they hadn't?`,type:`open`,depth:4,note:`Surfaces expectations about a partner's history.`},{id:`US-018`,q:`How much do you feel you give up of yourself to be in this relationship?`,type:`scale`,depth:4,note:`Surfaces the give-and-take balance honestly.`,guessable:!0,lo:`Very little`,hi:`A great deal`},{id:`US-028`,q:`Do you see marriage more as a covenant or a contract?`,type:`mc`,depth:4,ref:`Malachi 2:14`,note:`The 'covenant, not box-checking' question; surfaces permanence theology.`,guessable:!0,core:!0,opts:[`A sacred covenant before God`,`A lifelong commitment`,`A partnership that can end if needed`,`Not sure`]},{id:`US-041`,q:`Rank what you'd find hardest to give up for a marriage.`,type:`rank`,depth:4,note:`US-040 asks how readily you'd drop a hobby that was hurting us. This ranks everything that's actually on the table, and the order is far more revealing than any single willingness rating.`,opts:[`Time on my own`,`My friendships`,`My career plans`,`My hobbies`,`Making decisions on my own`,`My money being mine`]},{id:`US-042`,q:`Rank where your emotional energy actually goes right now.`,type:`rank`,depth:4,note:`US-032 ranks what should come first — the ideal. This ranks what is. The gap between a person's two answers is the honest conversation, and 'just keeping myself going' is the option that makes it possible to admit.`,opts:[`Work`,`Family`,`Friends`,`Church or ministry`,`This relationship`,`Just keeping myself going`]},{id:`US-044`,q:`If your life is too full right now, what would you actually cut to make room for us?`,type:`mc`,depth:4,ref:`Philippians 2:4`,note:`Turns a vague 'I'd prioritise you' into a real trade-off. Naming ministry as a competing good is deliberate — it's the hardest option to pick and the most revealing.`,guessable:!0,opts:[`Work hours`,`Time with friends`,`Ministry or serving`,`Hobbies and downtime`,`Nothing: I'd find the time somewhere`]},{id:`US-045`,q:`Which is harder for you to give right now?`,type:`mc`,depth:4,note:`Time and energy are different scarcities and the bank conflates them. Someone with a free diary and nothing left in the tank is the harder case, and the one nobody names.`,guessable:!0,opts:[`Time`,`Emotional energy`,`Neither: I have both`,`Both are stretched`]},{id:`US-046`,q:`Wanting to invest in us, and being able to right now, which is truer for you?`,type:`mc`,depth:4,note:`The desire-versus-capacity gap named directly. Option three is the one that surfaces a conversation nothing else in the bank reaches.`,guessable:!0,opts:[`I want to and I can`,`I want to but life is full`,`I have the time but I'm holding back`,`Neither, right now`]},{id:`US-049`,q:`Has what you're looking for in a partner changed since we met?`,type:`mc`,depth:4,note:`Surfaces whether the list bent to fit the person in front of them — which can be growth or self-deception. The conversation is the point.`,guessable:!0,opts:[`Not at all`,`A little`,`A lot: you changed it`,`I've let go of things that didn't matter`]},{id:`US-011`,q:`What about me gives you pause or concern right now?`,type:`open`,depth:5,note:`Invites honest concerns while there's still time.`},{id:`US-024`,q:`How much are you counting on me changing after we marry?`,type:`scale`,depth:5,note:`The personal application; the reveal is the whole point of the conversation.`,guessable:!0,lo:`Not at all, I accept you as you are`,hi:`I'm counting on some real changes`}]},"values-convictions":{name:`Convictions`,color:`#5C2E45`,icon:`compass`,questions:[{id:`VAL-013`,q:`How often do you talk politics?`,type:`mc`,depth:1,note:`Values & Convictions currently opens on abortion. This opens it gently — and the last option is a real echo-chamber tell.`,guessable:!0,core:!0,opts:[`Constantly`,`Now and then`,`I avoid it`,`Only with people who already agree with me`]},{id:`VAL-014`,q:`How much do you enjoy a good debate?`,type:`scale`,depth:1,note:`Sets the temperature before the deck turns the heat up. Two people who differ here will experience this deck very differently.`,guessable:!0,lo:`I avoid them`,hi:`I love one`},{id:`VAL-005`,q:`What's your view on the death penalty?`,type:`mc`,depth:3,note:`Surfaces a moral conviction about justice and life.`,guessable:!0,opts:[`Support it`,`Oppose it`,`Depends on the case`,`Unsure`]},{id:`VAL-006`,q:`Would you want guns in our home?`,type:`mc`,depth:3,note:`Both a values question and a practical home decision.`,guessable:!0,opts:[`Yes, comfortable`,`Only if secured / limited`,`No guns at all`,`Unsure`]},{id:`VAL-007`,q:`Where do you lean on immigration?`,type:`mc`,depth:3,note:`Surfaces political and moral leanings on a live issue.`,guessable:!0,opts:[`Stricter`,`Moderate`,`More open`,`Unsure`]},{id:`VAL-009`,q:`How do you hold creation and evolution together - or not?`,type:`mc`,depth:3,note:`Surfaces where faith and science meet for each of you.`,guessable:!0,opts:[`Young-earth creation`,`God-guided over long ages`,`Evolution, separate from faith`,`Still exploring`]},{id:`VAL-010`,q:`Where do you stand on vaccines?`,type:`mc`,depth:3,note:`A modern flashpoint that can hit parenting hard.`,guessable:!0,opts:[`Fully pro-vaccine`,`Selective`,`Hesitant`,`Against`]},{id:`VAL-001`,q:`Where do you land on abortion?`,type:`mc`,depth:5,note:`A core conviction couples need to know they share or differ on.`,guessable:!0,core:!0,opts:[`Always wrong`,`Wrong, with some exceptions`,`A personal or medical choice`,`Still working it out`]},{id:`VAL-002`,q:`What's your view on same-sex marriage?`,type:`mc`,depth:5,note:`Surfaces the belief and the lived, relational side of it.`,guessable:!0,opts:[`Wrong`,`Acceptable for others, not us`,`Fully support it`,`Still working it out`]},{id:`VAL-003`,q:`How do you feel about birth control?`,type:`mc`,depth:5,note:`Surfaces convictions that directly shape family planning.`,guessable:!0,opts:[`Avoid it entirely`,`Natural methods only`,`Most methods are fine`,`Whatever works for us`]},{id:`VAL-004`,q:`Under what circumstances, if any, is divorce acceptable to you?`,type:`mc`,depth:5,note:`Surfaces how each views the exit door before the vows.`,guessable:!0,core:!0,opts:[`Never`,`Only for abuse, adultery, or abandonment`,`When it's broken beyond repair`,`Still working it out`]},{id:`VAL-008`,q:`What's your view on assisted dying?`,type:`mc`,depth:5,note:`Surfaces convictions you may one day face for each other or family.`,guessable:!0,opts:[`Wrong`,`Acceptable in some cases`,`A personal right`,`Unsure`]},{id:`VAL-011`,q:`How important is it that we share the same social and political convictions?`,type:`scale`,depth:5,note:`Weights values/convictions gaps in the alignment score.`,guessable:!0,lo:`We can differ freely`,hi:`We need to agree`},{id:`VAL-012`,q:`How do you feel about living together before marriage?`,type:`mc`,depth:5,ref:`1 Corinthians 6:18`,note:`Cohabitation — a distinct moral/practical position the bank was missing.`,guessable:!0,opts:[`Wait until married`,`Okay once engaged`,`Fine if we're committed`,`No issue with it`]}]},"faithfulness-loyalty":{name:`Faithfulness`,color:`#7C4B72`,icon:`shield`,questions:[{id:`LOYAL-009`,q:`Are you the jealous type?`,type:`scale`,depth:1,note:`The warm-up. Self-rated, disarming, and it sets up everything else in the deck.`,guessable:!0,core:!0,lo:`Not at all`,hi:`Very`},{id:`LOYAL-010`,q:`Who'd get more attention in a room full of strangers?`,type:`mc`,depth:1,note:`HHB warm-up with a real edge under it — this is the deck about attention, after all.`,guessable:!0,opts:[`Him`,`Her`,`About the same`,`Neither of us, thankfully`]},{id:`LOYAL-004`,q:`How open should our social media be to each other?`,type:`scale`,depth:2,note:`Surfaces comfort levels around posts, follows, and online life.`,guessable:!0,lo:`Keep our profiles private`,hi:`Fully open to each other`},{id:`LOYAL-005`,q:`How open should our phones be to each other?`,type:`scale`,depth:2,note:`Surfaces expectations about privacy and openness with devices.`,guessable:!0,core:!0,lo:`Phones stay private`,hi:`Full access to each other`},{id:`LOYAL-006`,q:`How comfortable are you with solo trips with friends?`,type:`scale`,depth:2,note:`Surfaces trust and independence around time apart.`,guessable:!0,lo:`Not comfortable`,hi:`Totally fine`},{id:`LOYAL-007`,q:`How comfortable are you with close opposite-sex friendships after marriage?`,type:`scale`,depth:2,note:`Surfaces boundaries and comfort with friendships after marriage.`,guessable:!0,core:!0,lo:`Not comfortable`,hi:`Completely fine`},{id:`LOYAL-011`,q:`Is an emotional affair as bad as a physical one?`,type:`scale`,depth:3,note:`A genuine divider that the bank never asks. Couples routinely assume they agree here and routinely don't.`,guessable:!0,core:!0,lo:`Physical is far worse`,hi:`Emotional is far worse`},{id:`LOYAL-016`,q:`How much reassurance do you need to feel secure?`,type:`scale`,depth:3,note:`The security axis, entirely missing from the bank. A high-reassurance partner and a low-reassurance partner is a workable marriage — but only if they both know.`,guessable:!0,lo:`Very little`,hi:`Quite a lot`},{id:`LOYAL-008`,q:`How fully closed are your past relationships?`,type:`scale`,depth:4,note:`Surfaces genuine closure on exes.`,guessable:!0,lo:`Still processing them`,hi:`Fully closed`},{id:`LOYAL-012`,q:`If someone at work was clearly flirting with you, what would you do?`,type:`mc`,depth:4,note:`Behavioural rather than principled. INT-004 asks where the line is; this asks what you'd actually do standing on it.`,guessable:!0,core:!0,opts:[`Shut it down immediately`,`Keep it professional and say nothing`,`Tell you about it that evening`,`Enjoy it a bit, honestly`]},{id:`LOYAL-013`,q:`Would you tell me if you found someone else attractive?`,type:`mc`,depth:4,note:`The honesty-versus-kindness trade-off, made concrete. Both answers are defensible, which is what makes the gap worth talking about.`,guessable:!0,opts:[`Always`,`Only if it was becoming a problem`,`No: it would only hurt you`,`There'd be nothing to tell`]},{id:`LOYAL-014`,q:`Do you still follow or message any exes?`,type:`mc`,depth:4,note:`PAST-002 asks this open-ended and gets a speech. This gets an answer.`,guessable:!0,opts:[`No, none`,`One or two, just following`,`We still talk occasionally`,`Yes: we're genuinely close`]},{id:`LOYAL-015`,q:`What would you do if you saw me being a bit too friendly with someone?`,type:`mc`,depth:4,note:`The other side of the deck: not what you'd do, but what you'd do about me. 'Say nothing but feel it' is the answer that predicts trouble.`,guessable:!0,opts:[`Say something to you that night`,`Wait and see if it carried on`,`Say nothing, but feel it`,`Say something to them`]},{id:`LOYAL-017`,q:`Rank what would feel most like a betrayal.`,type:`rank`,depth:4,note:`The best question in the deck. Forces a comparison nobody makes voluntarily — is porn worse than confiding in someone else, is hidden money worse than a kiss. Two very different lists is the conversation.`,core:!0,opts:[`A physical affair`,`An emotional affair`,`Hiding money from me`,`Confiding in someone else instead of me`,`Looking at porn`,`Repeatedly lying about small things`]},{id:`LOYAL-001`,q:`Where does crossing the line begin for you?`,type:`mc`,depth:5,note:`Surfaces where each draws the line on faithfulness, emotional and physical.`,guessable:!0,opts:[`Any flirting`,`Emotional closeness with someone else`,`Only physical contact`,`We should define it together`]},{id:`LOYAL-002`,q:`How do you view pornography in a marriage?`,type:`mc`,depth:5,note:`A sensitive but important boundary conversation.`,core:!0,opts:[`Never acceptable`,`A serious problem`,`Depends`,`Not a big deal`]},{id:`LOYAL-003`,q:`If one of us struggles with sexual temptation or pornography, what should we do?`,type:`mc`,depth:5,ref:`Galatians 6:1-2`,note:`The accountability protocol — distinct from the moral view of porn (INT-006).`,guessable:!0,opts:[`Always tell each other`,`Tell a mentor or accountability partner`,`Handle it privately`,`Unsure`]}]},"where-we-are-now":{name:`Where We Are Now`,color:`#9C4A6E`,icon:`compass`,hook:{id:`NOW-025`,q:`When did we last properly laugh together?`},questions:[{id:`NOW-025`,q:`When did we last properly laugh together?`,type:`mc`,depth:1,note:`The warm-up this deck badly needed, and quietly one of its best questions. Light to answer, and 'it's been a while' is a real finding sitting inside a soft question.`,guessable:!0,notYet:!0,opts:[`Today or yesterday`,`Sometime this week`,`I'd have to think about it`,`It's been a while`]},{id:`NOW-026`,q:`What's been the best bit of the last month for us?`,type:`mc`,depth:1,note:`Warm, affirming, and the last option gives permission to be honest without having to make a speech about it.`,guessable:!0,notYet:!0,opts:[`Something we did together`,`A conversation we had`,`Just being around each other`,`Honestly, it's been a bit of a slog`]},{id:`NOW-027`,q:`How often do we try something new together?`,type:`mc`,depth:1,note:`Novelty as an observable fact. Light, and it pairs with the momentum question deeper in the deck.`,guessable:!0,notYet:!0,opts:[`All the time`,`Now and then`,`Rarely`,`We're deep in a routine`]},{id:`NOW-008`,q:`Rank where you feel closest to me.`,type:`rank`,depth:2,note:`Where connection actually lives. Distinct from CONF-009 (love languages) — that's how love is given and received, this is the setting in which the two of you click.`,notYet:!0,opts:[`Doing something together`,`Deep conversation`,`Comfortable silence`,`Working through a problem side by side`,`Being physically close`,`Praying or worshipping together`]},{id:`NOW-001`,q:`How much has this relationship actually been tested?`,type:`mc`,depth:3,ref:`James 1:2-4`,note:`The most important question in the bank. Everything else assumes each person has evidence about the other; this asks whether that evidence exists. Two people answering 'not tested yet' is not alignment — it's the finding.`,guessable:!0,opts:[`We've been through something genuinely hard together`,`We've had real arguments and come through them`,`Some friction, nothing serious`,`It's been smooth: we haven't been tested yet`]},{id:`NOW-002`,q:`Right now, what is this?`,type:`mc`,depth:3,note:`A present-tense read on the thing itself. US-033 asks intent for the season; this asks what the relationship actually is at this moment, which is a different and often uncomfortable answer.`,guessable:!0,opts:[`Solid: it knows what it is`,`Something real that's still finding its shape`,`In transition: changing in ways neither of us controls`,`Still deciding what we want it to be`]},{id:`NOW-009`,q:`What does this relationship bring out in you?`,type:`mc`,depth:3,note:`Who you become in it, rather than what you believe about it. Generative rather than wounding — every option is a conversation, none is a verdict.`,guessable:!0,notYet:!0,opts:[`More tender than I expected`,`More guarded than I admit`,`More demanding than I show`,`More patient than I usually am`,`More loyal than people realise`]},{id:`NOW-012`,q:`When something's clearly bothering me but I won't say what, you:`,type:`mc`,depth:3,note:`The pursue-or-withdraw move, as behaviour. Pairs with the CONF question about how my going quiet lands on you — that one is the feeling, this is what you actually do about it.`,guessable:!0,notYet:!0,opts:[`Ask directly`,`Create space and wait for me`,`Feel frustrated but don't push`,`Assume it'll surface when I'm ready`]},{id:`NOW-019`,q:`After a disagreement, how long does it take us to be okay again?`,type:`mc`,depth:3,note:`Observed repair speed. CONF-002 asks how soon you like to resolve conflict — the preference. This is what actually happens between the two of you.`,guessable:!0,notYet:!0,opts:[`Minutes`,`A few hours`,`A day or two`,`We don't really close things, they fade`]},{id:`NOW-021`,q:`Are we the same together in private as we are in front of other people?`,type:`mc`,depth:3,ref:`Proverbs 10:9`,note:`SELF-026 asks whether an individual is consistent across audiences. This asks it of the couple, which is a different and more uncomfortable question.`,guessable:!0,notYet:!0,opts:[`Exactly the same`,`A bit more relaxed on our own`,`Quite different`,`We perform a bit when others are around`]},{id:`NOW-022`,q:`Compared to six months ago, where are we?`,type:`mc`,depth:3,note:`Momentum rather than state. This is the question that makes the category worth re-taking — the answer is meaningless once and meaningful four times.`,guessable:!0,notYet:!0,opts:[`Much closer`,`A bit closer`,`About the same`,`Drifting, if I'm honest`]},{id:`NOW-003`,q:`How well do you feel understood by me?`,type:`scale`,depth:4,note:`Being known, rated by the one being known. A gap here — one feels deeply understood, the other doesn't — is one of the most useful reveals the app can produce.`,guessable:!0,notYet:!0,lo:`You see the surface`,hi:`You get the parts most people miss`},{id:`NOW-004`,q:`How does giving to this relationship feel to you right now?`,type:`mc`,depth:4,note:`The economics of giving. 'Costly' is the option nobody volunteers unprompted, which is exactly why it has to be on the list.`,guessable:!0,notYet:!0,opts:[`Natural: I don't keep score`,`Intentional: I want you to feel it`,`Measured: I think about how much I put in`,`Costly: part of me notices what it takes from ather name it`,`Give you space, you might need it`,`Feel it but stay quiet, I don't want to be demanding`,`Pull back too`]},{id:`NOW-014`,q:`What's the one change in you that would most improve us?`,type:`mc`,depth:4,ref:`Matthew 7:5`,note:`SELF-015 asks what you'd change about yourself in the abstract and is open-ended. This aims it at the relationship and makes it scoreable — and the reveal is whether each guessed the other's answer.`,guessable:!0,notYet:!0,opts:[`Being less defensive`,`Being more present`,`Speaking up sooner`,`Needing less control`,`Being gentler with myself`]},{id:`NOW-015`,q:`What is trust between us currently built on?`,type:`mc`,depth:4,note:`Trust as a present-tense structure rather than a value. 'Hope more than evidence' is where a lot of engaged couples honestly are, and no question in the bank lets them say it.`,guessable:!0,notYet:!0,opts:[`Track record: you've proven it`,`What I believe about your character`,`Hope and faith more than evidence`,`It isn't fully there yet`]},{id:`NOW-017`,q:`What have we avoided talking about?`,type:`mc`,depth:4,note:`An avoidance map. If both name the same thing, that's the next conversation handed to them. If they name different things, that's two.`,guessable:!0,notYet:!0,opts:[`Nothing I can think of`,`Money`,`Family`,`The physical side`,`The future`,`Something one of us did`]},{id:`NOW-023`,q:`When did you last feel far from me?`,type:`mc`,depth:4,note:`Distance as an event with a date, not a rating. 'Recently, and it hasn't passed' is a live issue the app just found.`,guessable:!0,notYet:!0,opts:[`I can't remember feeling far from you`,`Recently, but it passed`,`Recently, and it hasn't passed`,`Often, honestly`]},{id:`NOW-013`,q:`Does this relationship bring out more in you, or less?`,type:`scale`,depth:5,ref:`Proverbs 27:17`,note:`The heaviest question in the category and correctly placed last. A low answer from either side is the whole point of an app called Aligned.`,guessable:!0,notYet:!0,lo:`Less
