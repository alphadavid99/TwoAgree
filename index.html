<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is REQUIRED for env(safe-area-inset-*) to return
         anything but 0. Without it the app's safe-area CSS is dead code inside
         the iOS shell: the TopBar slides under the Dynamic Island and the pill
         nav collides with the home indicator. Grounds bleed to the physical
         edges; content starts below the safe line (docs/UX-REVIEW-2026-07.md §11). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- TwoAgree — icons & PWA (02-web assets live at the /public root) -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The phone paints its status bar (and, on some iPhones, the strip under
         the home indicator) in this colour. It matches the top of the page,
         the pink of the waves, so the app reads as full screen; claret here
         showed as a dark band above the app (Dave, Nov 2026). -->
    <meta name="theme-color" content="#F7D7E0" />

    <!-- Preload the wordmark font so the mark's letters render in Inter on
         first paint (no fallback-font flash). -->
    <link
      rel="preload"
      href="/fonts/inter-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>TwoAgree: Can two walk together?</title>
    <meta
      name="description"
      content="A faith-centred way for the two of you to talk through what matters, get to know each other better, and walk toward agreement together."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TwoAgree" />
    <meta property="og:title" content="TwoAgree: Can two walk together?" />
    <meta
      property="og:description"
      content="A faith-centred way for the two of you to talk through what matters, get to know each other better, and walk toward agreement together."
    />
    <meta property="og:url" content="https://twoagree.app/" />
    <meta
      property="og:image"
      content="https://twoagree.app/og-default-1200x630.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The TwoAgree mark: two strokes rising to meet, in gold on claret."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TwoAgree: Can two walk together?" />
    <meta
      name="twitter:description"
      content="Talk through what matters, get to know each other better, and walk toward agreement together."
    />
    <meta
      name="twitter:image"
      content="https://twoagree.app/og-default-1200x630.png"
    />
  </head>
  <body>
    <!-- The launch screen (feedback, Nov 2026): the wordmark, centred, from
         the first paint until the app's first real screen is ready; then it
         fades (src/lib/splash.ts). Static, so it shows before any script has
         loaded. Styled by .splash in index.css, which the build links in this
         head. Mirrors src/brand/Wordmark.tsx: the mark is the A. -->
    <div id="splash" role="img" aria-label="TwoAgree">
      <span class="splash-wm" aria-hidden="true">
        <span>Two</span><svg viewBox="824 921 220 220" preserveAspectRatio="xMidYMid meet"><path d="M 899.862 924.822 L 931.116 924.873 C 924.792 948.339 914.369 977.735 906.723 1001.42 L 862.728 1137.09 L 831.598 1137.05 C 837.714 1114.43 847.64 1086.35 854.954 1063.72 L 899.862 924.822 z" /><path d="M 936.886 924.882 L 968.149 924.866 C 989.722 995.197 1015.72 1066.75 1036.41 1137.01 L 1005.08 1137.08 C 982.589 1067.65 957.822 994.521 936.886 924.882 z" /></svg><span>gree</span>
      </span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
